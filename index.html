<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wangan Zero</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(239, 130, 189, 0.1), transparent 30%),
          radial-gradient(circle at top right, rgba(112, 188, 226, 0.09), transparent 24%),
          linear-gradient(180deg, #080914 0%, #03050a 100%);
        color: #e8dcc7;
        font-family: "Aptos", "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        box-sizing: border-box;
      }

      canvas {
        max-width: min(100%, 1100px);
        max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);
        height: auto;
        border: 1px solid rgba(240, 221, 147, 0.26);
        border-radius: 24px;
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.62),
          0 0 0 1px rgba(255, 255, 255, 0.04);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/games/wangan-zero/src/main.ts"></script>
  </body>
</html>
